<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="nullx11code CLI">
  <defs>
    <linearGradient id="cwin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a24"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="chalo" cx="50%" cy="55%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c6d0de"/>
    </linearGradient>
    <filter id="cglow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cclip"><rect x="10" y="16" width="108" height="96" rx="16"/></clipPath>
  </defs>

  <!-- terminal window -->
  <rect x="10" y="16" width="108" height="96" rx="16" fill="url(#cwin)" stroke="#2a3342" stroke-width="4"/>
  <path d="M10 40 h108" stroke="#2a3342" stroke-width="4"/>
  <circle cx="30" cy="28" r="5" fill="#39424f"/>
  <circle cx="48" cy="28" r="5" fill="#39424f"/>
  <circle cx="66" cy="28" r="5" fill="#39424f"/>

  <!-- binary rain inside the terminal -->
  <g clip-path="url(#cclip)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="8" font-weight="600">
    <g fill="#76b900" opacity=".6">
      <text x="18" y="56">01</text>
      <text x="18" y="74">10</text>
      <text x="18" y="104">01</text>
      <text x="102" y="56">10</text>
      <text x="102" y="86">01</text>
      <text x="92" y="108">1</text>
    </g>
    <g fill="#e8eef7" opacity=".35">
      <text x="32" y="56">1</text>
      <text x="102" y="72">1</text>
      <text x="92" y="60">0</text>
      <text x="32" y="108">0</text>
    </g>
    <g fill="#ffffff" opacity=".16">
      <text x="32" y="86">01</text>
      <text x="78" y="52">10</text>
      <text x="78" y="108">1</text>
    </g>
  </g>

  <ellipse cx="58" cy="76" rx="26" ry="24" fill="url(#chalo)"/>

  <!-- mini anime sprite -->
  <g filter="url(#cglow)">
    <path d="M45 60 L42 46 L54 54 Z" fill="url(#cbody)"/>
    <path d="M71 60 L74 46 L62 54 Z" fill="url(#cbody)"/>
    <path d="M58 51c-9 0-15 6-15 14 0 5 3 8 3 11 0 3-2 5-2 7 0 3 3 4 7 4h14c4 0 7-1 7-4 0-2-2-4-2-7 0-3 3-6 3-11 0-8-6-14-15-14z"
          fill="url(#cbody)"/>
    <ellipse cx="46" cy="70" rx="3" ry="1.8" fill="#f7b8c4" opacity=".8"/>
    <ellipse cx="70" cy="70" rx="3" ry="1.8" fill="#f7b8c4" opacity=".8"/>
    <ellipse cx="52" cy="67" rx="3.4" ry="4.2" fill="#131923"/>
    <ellipse cx="64" cy="67" rx="3.4" ry="4.2" fill="#131923"/>
    <circle cx="53" cy="65.6" r="1.2" fill="#fff"/>
    <circle cx="65" cy="65.6" r="1.2" fill="#fff"/>
    <path d="M55 74 q3 2.4 6 0" stroke="#131923" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- glowing prompt line -->
  <g stroke-linecap="round" filter="url(#cglow)">
    <path d="M40 96 L47 101 L40 106" stroke="#ffffff" stroke-width="4.5" fill="none"/>
    <path d="M56 106 H84" stroke="#ffffff" stroke-width="4.5"/>
    <path d="M90 106 h6" stroke="#76b900" stroke-width="4.5"/>
  </g>
</svg>
