name: Test nullx11code

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --include=optional
      - name: Require the pinned native runtime
        run: node_modules/.bin/opencode --version
      - run: npm test
      - name: Browser integration tests
        if: matrix.node == 22
        run: npm run test:browser
      - run: sh -n install.sh
      - run: npm pack --dry-run
